<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letras & Vinos — Catálogo de libros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blanco-calido:#FAF8F3;
    --porcelana:#F2EEE8;
    --rosa-niebla:#F7DCE5;
    --lila-suave:#DCD5FF;
    --azul-hielo:#DDF5F3;
    --borgona:#7A2036;
    --borgona-osc:#5A1727;
    --coral:#FF5570;
    --coral-osc:#B33449;
    --texto:#3A3335;
    --texto-suave:#7A7275;
    --linea:#E7DFE2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--blanco-calido);
    font-family:'Inter',sans-serif;
    color:var(--texto);
  }
  header{
    padding:2.2rem 1.5rem 1.5rem;
    text-align:center;
  }
  .logo-marca{
    display:block;
    max-width:400px;
    width:82%;
    margin:0 auto;
    border-radius:14px;
  }
  header p.tagline{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-style:italic;
    font-size:1rem;
    color:var(--texto-suave);
    margin:0.8rem 0 0;
  }
  header p.sub{
    font-size:0.72rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--texto-suave);
    margin:1rem 0 0;
  }
  .barra{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--blanco-calido);
    border-bottom:1px solid var(--linea);
    padding:1rem 1.5rem;
    display:flex;
    flex-wrap:wrap;
    gap:0.75rem;
    align-items:center;
    justify-content:center;
  }
  .barra input[type="text"], .barra select{
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    padding:0.55rem 0.9rem;
    border-radius:20px;
    border:1px solid var(--linea);
    background:#fff;
    color:var(--texto);
    outline:none;
  }
  .barra input[type="text"]{min-width:220px;flex:1 1 220px;}
  .barra select{cursor:pointer;}
  .barra label.chk{
    display:flex;align-items:center;gap:0.4rem;
    font-size:0.82rem;color:var(--borgona);
    background:#fff;border:1px solid var(--linea);
    padding:0.5rem 0.9rem;border-radius:20px;cursor:pointer;
  }
  .contador{
    text-align:center;font-size:0.78rem;color:var(--texto-suave);
    padding:0.8rem 1.5rem 0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:1.3rem;
    padding:1.2rem 1.5rem 3rem;
    max-width:1240px;
    margin:0 auto;
  }
  .card{
    background:#fff;
    border:1px solid var(--linea);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .card .foto{
    width:100%;
    height:170px;
    object-fit:cover;
    display:block;
    background:var(--porcelana);
  }
  .card .foto-vacia{
    width:100%;
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--porcelana);
    color:var(--texto-suave);
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:0.85rem;
  }
  .card .cuerpo{padding:1rem 1.15rem 1.15rem;display:flex;flex-direction:column;flex:1;}
  .genero-tag{
    display:inline-block;
    font-size:0.66rem;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--borgona);
    font-weight:600;
    background:var(--rosa-niebla);
    padding:0.2rem 0.6rem;
    border-radius:10px;
    margin-bottom:0.55rem;
    width:fit-content;
  }
  .card h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:1.05rem;
    line-height:1.3;
    margin:0 0 0.5rem;
    color:var(--texto);
  }
  .card .sinopsis{
    font-size:0.8rem;
    line-height:1.55;
    color:var(--texto-suave);
    margin:0 0 0.8rem;
  }
  .fila-precio{
    display:flex;align-items:center;justify-content:space-between;
    margin:0.2rem 0 0.7rem;
  }
  .precio{font-size:1.15rem;font-weight:600;color:var(--borgona);}
  .estado{
    font-size:0.7rem;font-weight:500;padding:0.2rem 0.6rem;border-radius:12px;
  }
  .estado.disp{background:var(--azul-hielo);color:#1F6E63;}
  .estado.agot{background:var(--porcelana);color:var(--coral-osc);}
  .btn{
    margin-top:auto;
    text-align:center;
    text-decoration:none;
    font-size:0.82rem;
    font-weight:500;
    padding:0.6rem 0.8rem;
    border-radius:8px;
    display:block;
  }
  .btn.activo{
    background:var(--borgona);
    color:#fff;
  }
  .btn.activo:hover{background:var(--borgona-osc);}
  .btn.inactivo{
    background:var(--porcelana);
    color:var(--texto-suave);
    cursor:default;
    pointer-events:none;
  }
  .vacio{
    text-align:center;color:var(--texto-suave);padding:3rem 1rem;font-size:0.95rem;
  }
  .cargando{
    text-align:center;color:var(--texto-suave);padding:4rem 1rem;
    font-family:'Fraunces',serif;font-style:italic;font-size:1rem;
  }
  footer{
    text-align:center;
    padding:1.8rem 1rem 2.2rem;
    background:var(--porcelana);
    color:var(--texto);
    font-size:0.85rem;
  }
  footer .logo{
    font-family:'Fraunces',serif;font-weight:500;font-size:1.1rem;
    color:var(--borgona);
    margin-bottom:0.5rem;
  }
  footer .datos{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;color:var(--texto-suave);}
  @media (max-width:480px){
    .barra{padding:0.8rem;}
  }
</style>
</head>
<body>

<header>
  <img class="logo-marca" src="logo.png" alt="Letras &amp; Vinos">
  <p class="tagline">Lectura en estado líquido</p>
  <p class="sub">Catálogo de libros</p>
</header>

<div class="barra">
  <input type="text" id="buscador" placeholder="Buscar por título...">
  <select id="filtroGenero"><option>Todos los géneros</option></select>
  <select id="orden">
    <option value="alfa">Ordenar: Título A-Z</option>
    <option value="precioAsc">Precio: menor a mayor</option>
    <option value="precioDesc">Precio: mayor a menor</option>
  </select>
  <label class="chk"><input type="checkbox" id="soloDisponibles"> Solo disponibles</label>
</div>

<p class="contador" id="contador"></p>

<div class="grid" id="grid"><div class="cargando">Cargando catálogo…</div></div>

<footer>
  <div class="logo">Letras &amp; Vinos</div>
  <div class="datos">
    <span>(504) 9246-1991</span>
    <span>@letras_vinos</span>
    <span>letrasyvinos2025@gmail.com</span>
  </div>
</footer>

<script>
// ---------------------------------------------------------------------
// CATÁLOGO EN VIVO: lee la pestaña "Catálogo Público" del Google Sheet
// (publicada como CSV). Al editar el Sheet, el catálogo se actualiza
// solo (el cambio puede tardar unos minutos en reflejarse, por el caché
// de Google). Las fotos y el logo viven en este mismo repositorio.
// ---------------------------------------------------------------------
const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjfjTYsQEQ7rEAPX8I7VRqsS0lksYUPAJl_Zdv7JG9Geeq5si-yqmKXAx-2P_t7qglB2TBkJj0RpM/pub?gid=15425874&single=true&output=csv";
const NUMERO_WHATSAPP = "50492461991";

const grid = document.getElementById("grid");
const contador = document.getElementById("contador");
const buscador = document.getElementById("buscador");
const filtroGenero = document.getElementById("filtroGenero");
const orden = document.getElementById("orden");
const soloDisponibles = document.getElementById("soloDisponibles");

let LIBROS = [];

function parseCSV(texto){
  const filas = [];
  let fila = [], campo = "", enComillas = false;
  for(let i = 0; i < texto.length; i++){
    const c = texto[i];
    if(enComillas){
      if(c === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else enComillas = false;
      } else campo += c;
    } else {
      if(c === '"') enComillas = true;
      else if(c === ','){ fila.push(campo); campo = ""; }
      else if(c === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ""; }
      else if(c !== '\r') campo += c;
    }
  }
  if(campo !== "" || fila.length) { fila.push(campo); filas.push(fila); }
  return filas;
}

function limpiarPrecio(t){
  if(!t) return 0;
  const m = String(t).replace(/[^0-9.,]/g,'').replace(/,/g,'');
  const n = parseFloat(m);
  return isNaN(n) ? 0 : n;
}

function normalizarTitulo(t){
  return t.trim().replace(/\s+/g,' ');
}

function capitalizar(t){
  const minusculas = ['de','del','la','las','el','los','y','a','en','que','un','una','con','no','al','tu','su','mi','para','por','se'];
  return t.toLowerCase().split(' ').map((w,i)=>{
    if(i>0 && minusculas.includes(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function procesar(filas){
  const porTitulo = new Map();
  for(let i = 1; i < filas.length; i++){
    const f = filas[i];
    if(!f || f.length < 4) continue;
    const nombre = normalizarTitulo(f[0] || "");
    if(!nombre) continue;
    const clave = nombre.toUpperCase();
    const disp = parseInt(f[2]) || 0;
    const precio = limpiarPrecio(f[3]);
    const sinopsis = (f[4] || "").trim();
    const foto = (f[5] || "").trim();
    if(porTitulo.has(clave)){
      const e = porTitulo.get(clave);
      e.disponible += disp;
      if(!e.precio && precio) e.precio = precio;
      if(disp > 0 && precio) e.precio = precio;
      if(!e.sinopsis && sinopsis) e.sinopsis = sinopsis;
      if(!e.foto && foto) e.foto = foto;
    } else {
      porTitulo.set(clave, {
        titulo: capitalizar(nombre),
        genero: capitalizar((f[1] || "").trim() || "Otros"),
        disponible: disp,
        precio: precio,
        sinopsis: sinopsis,
        foto: foto
      });
    }
  }
  return Array.from(porTitulo.values());
}

function mensajeWhatsapp(libro){
  const texto = `Hola! Me interesa el libro "${libro.titulo}" (L.${libro.precio}). ¿Está disponible?`;
  return `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(texto)}`;
}

function render(){
  const q = buscador.value.trim().toLowerCase();
  const g = filtroGenero.value;
  const soloDisp = soloDisponibles.checked;
  const ord = orden.value;

  let lista = LIBROS.filter(l=>{
    if(q && !l.titulo.toLowerCase().includes(q)) return false;
    if(g !== "Todos los géneros" && l.genero !== g) return false;
    if(soloDisp && l.disponible <= 0) return false;
    return true;
  });

  if(ord === "alfa") lista.sort((a,b)=>a.titulo.localeCompare(b.titulo,'es'));
  if(ord === "precioAsc") lista.sort((a,b)=>a.precio-b.precio);
  if(ord === "precioDesc") lista.sort((a,b)=>b.precio-a.precio);

  contador.textContent = `Mostrando ${lista.length} de ${LIBROS.length} libros`;

  if(lista.length === 0){
    grid.innerHTML = `<div class="vacio">No encontramos libros con esos filtros. Prueba con otra búsqueda o género.</div>`;
    return;
  }

  grid.innerHTML = lista.map(l=>`
    <div class="card">
      ${l.foto
        ? `<img class="foto" src="${l.foto}" alt="${l.titulo}" loading="lazy" onerror="this.outerHTML='<div class=\\'foto-vacia\\'>Letras &amp; Vinos</div>'">`
        : `<div class="foto-vacia">Letras &amp; Vinos</div>`}
      <div class="cuerpo">
        <div class="genero-tag">${l.genero}</div>
        <h3>${l.titulo}</h3>
        ${l.sinopsis ? `<p class="sinopsis">${l.sinopsis}</p>` : ``}
        <div class="fila-precio">
          <span class="precio">${l.precio ? 'L.' + l.precio : ''}</span>
          <span class="estado ${l.disponible > 0 ? 'disp':'agot'}">${l.disponible > 0 ? 'Disponible':'Agotado'}</span>
        </div>
        ${l.disponible > 0
          ? `<a class="btn activo" href="${mensajeWhatsapp(l)}" target="_blank" rel="noopener">Lo quiero — WhatsApp</a>`
          : `<span class="btn inactivo">No disponible</span>`
        }
      </div>
    </div>
  `).join("");
}

fetch(URL_CSV)
  .then(r => {
    if(!r.ok) throw new Error("No se pudo leer el catálogo");
    return r.text();
  })
  .then(texto => {
    LIBROS = procesar(parseCSV(texto));
    const generos = ["Todos los géneros", ...Array.from(new Set(LIBROS.map(l=>l.genero))).sort()];
    filtroGenero.innerHTML = generos.map(g=>`<option value="${g}">${g}</option>`).join("");
    render();
  })
  .catch(err => {
    grid.innerHTML = `<div class="vacio">No pudimos cargar el catálogo en este momento. Intenta de nuevo en unos minutos.</div>`;
  });

buscador.addEventListener("input", render);
filtroGenero.addEventListener("change", render);
orden.addEventListener("change", render);
soloDisponibles.addEventListener("change", render);
</script>

</body>
</html>
