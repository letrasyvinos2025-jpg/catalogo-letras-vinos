<script>
// ---------------------------------------------------------------------
// CATÁLOGO EN VIVO: lee dos pestañas del Google Sheet, publicadas como CSV.
//
// 1) Inventario (CODIGO, NOMBRE, AUTOR, GENERO, VENDIDO, DISPONIBLE,
//    PRECIO, SINOPSIS, FOTO, TIPO, GRUPOCAJA, CAJACOMPLETA, IDIOMA) —
//    una fila por código/lote de cada libro. TIPO es Pasta Blanda /
//    Pasta Dura ("TIPO DE LIBRO" en el Sheet). GRUPOCAJA identifica el
//    lote exacto de una caja ("GRUPO CAJA"). CAJACOMPLETA distingue
//    Sí (esta fila es la caja completa), No (tomo suelto normal) y
//    Solo Caja (tomo que nunca se vende suelto) — columna
//    "CAJA COMPLETA". IDIOMA es el idioma del libro.
// 2) Ventas por Código (CÓDIGO, CONTEO) — cuántas veces aparece cada
//    código en "Detalle de Ventas", sin datos de clientas.
//
// Cajas completas: para cada Grupo Caja, se calcula cuántas cajas
// completas hay sumando el disponible de cada tomo por título dentro
// del grupo y tomando el mínimo entre los tomos — si falta uno, la
// caja no está completa aunque los demás tengan stock. Los tomos
// "Solo Caja" nunca aparecen como tarjeta propia, solo cuentan para
// ese cálculo.
//
// Reglas de negocio (las mismas que ya usa el bot de Telegram):
// - Un mismo título con el mismo precio en varios códigos se consolida
//   sumando su disponibilidad. Si dos códigos del mismo título tienen
//   precios distintos, se tratan por separado.
// - De los precios de un título que tengan stock, se muestra solo el
//   más barato. En cuanto ese se agota, el catálogo pasa solo al
//   siguiente precio disponible — nunca se muestran dos precios del
//   mismo título a la vez.
// - Cotejo en vivo: si "Ventas por Código" muestra más ventas de un
//   código que las que ya están registradas en VENDIDO (venta hecha
//   pero inventario aún no actualizado a mano), se resta esa
//   diferencia al disponible que se muestra, para no ofrecer un
//   ejemplar que ya está comprometido.
//
// Al editar el Sheet, el catálogo se actualiza solo (puede tardar unos
// minutos por el caché de Google).
//
// Los libros agotados muestran "Solicitar este libro": el formulario
// envía nombre y celular a una Apps Script Web App que agrega la fila
// en "Solicitudes de Libros" buscando cada columna por su encabezado,
// igual que hace el bot de Telegram.
// ---------------------------------------------------------------------
const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjfjTYsQEQ7rEAPX8I7VRqsS0lksYUPAJl_Zdv7JG9Geeq5si-yqmKXAx-2P_t7qglB2TBkJj0RpM/pub?gid=15425874&single=true&output=csv";
const URL_CSV_VENTAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjfjTYsQEQ7rEAPX8I7VRqsS0lksYUPAJl_Zdv7JG9Geeq5si-yqmKXAx-2P_t7qglB2TBkJj0RpM/pub?gid=670296559&single=true&output=csv";
const URL_CSV_INSUMOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjfjTYsQEQ7rEAPX8I7VRqsS0lksYUPAJl_Zdv7JG9Geeq5si-yqmKXAx-2P_t7qglB2TBkJj0RpM/pub?gid=1274059426&single=true&output=csv";
const NUMERO_WHATSAPP = "50492461991";
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz0dFtc_8wt70-JXk_HD7ZFofMNA_H4dLryxf0sxZjeg1CzOd86x295969rqW_cP4yd/exec";

const grid = document.getElementById("grid");

let LIBROS = [];
let INSUMOS = [];
let libroActivo = null;

function parseCSV(texto){
  const filas = [];
  let fila = [], campo = "", enComillas = false;
  for(let i = 0; i < texto.length; i++){
    const c = texto[i];
    if(enComillas){
      if(c === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else enComillas = false;
      } else campo += c;
    } else {
      if(c === '"') enComillas = true;
      else if(c === ','){ fila.push(campo); campo = ""; }
      else if(c === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ""; }
      else if(c !== '\r') campo += c;
    }
  }
  if(campo !== "" || fila.length) { fila.push(campo); filas.push(fila); }
  return filas;
}

function limpiarPrecio(t){
  if(!t) return 0;
  const m = String(t).replace(/[^0-9.,]/g,'').replace(/,/g,'');
  const n = parseFloat(m);
  return isNaN(n) ? 0 : n;
}

function normalizarTitulo(t){
  return t.trim().replace(/\s+/g,' ');
}

function capitalizar(t){
  const minusculas = ['de','del','la','las','el','los','y','a','en','que','un','una','con','no','al','tu','su','mi','para','por','se'];
  return t.toLowerCase().split(' ').map((w,i)=>{
    if(i>0 && minusculas.includes(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function normalizarPlano(t){
  const combinados = /[\u0300-\u036f]/g;
  const sinAcentos = (t || "").toString().normalize("NFD").replace(combinados, "");
  return sinAcentos.trim().toLowerCase();
}

function parseVentasPorCodigo(filas){
  const mapa = new Map();
  for(let i = 1; i < filas.length; i++){
    const f = filas[i];
    if(!f || f.length < 2) continue;
    const codigo = (f[0] || "").trim();
    if(!codigo) continue;
    const conteo = parseInt(f[1]) || 0;
    mapa.set(codigo, conteo);
  }
  return mapa;
}

// Columnas del CSV de Inventario, en orden:
// CODIGO, NOMBRE, AUTOR, GENERO, VENDIDO, DISPONIBLE, PRECIO, SINOPSIS, FOTO,
// TIPO, GRUPOCAJA, CAJACOMPLETA, IDIOMA
function procesar(filas, mapaVentas){
  // Paso 1: una entrada por código/fila, con el disponible ya ajustado
  // por el cotejo contra "Ventas por Código".
  const porCodigo = [];
  for(let i = 1; i < filas.length; i++){
    const f = filas[i];
    if(!f || f.length < 6) continue;
    const codigo = (f[0] || "").trim();
    const nombre = normalizarTitulo(f[1] || "");
    if(!nombre) continue;
    const autor = (f[2] || "").trim();
    const genero = (f[3] || "").trim();
    const vendidoDeclarado = parseInt(f[4]) || 0;
    const disponibleDeclarado = parseInt(f[5]) || 0;
    const precio = limpiarPrecio(f[6]);
    const sinopsis = (f[7] || "").trim();
    const foto = (f[8] || "").trim();
    // Pasta Blanda / PASTA BLANDA / pasta blanda: se normaliza igual,
    // sin importar cómo se haya escrito en el Sheet.
    const tipo = capitalizar((f[9] || "").trim());
    const idioma = capitalizar((f[12] || "").trim());

    const grupoRaw = (f[10] || "").trim();
    const grupoCaja = (!grupoRaw || normalizarPlano(grupoRaw) === "n/a") ? "" : grupoRaw;
    const cajaValor = normalizarPlano(f[11] || "");
    const esCajaCompleta = cajaValor === "si";
    const esSoloCaja = cajaValor === "solo caja";

    const ventaReal = mapaVentas.get(codigo) || 0;
    const brecha = Math.max(0, ventaReal - vendidoDeclarado);
    const disponibleAjustado = Math.max(0, disponibleDeclarado - brecha);

    porCodigo.push({
      nombre, autor, genero, precio, sinopsis, foto, tipo, idioma,
      grupoCaja, esCajaCompleta, esSoloCaja,
      disponible: disponibleAjustado
    });
  }

  // Paso 2: para cada Grupo Caja, calcular cuántas cajas completas se
  // pueden armar. Se suma por título dentro del grupo (por si el mismo
  // tomo del mismo lote tuviera dos filas) y se toma el mínimo entre
  // los tomos distintos del grupo — si falta uno, no hay caja completa.
  const disponiblePorGrupo = new Map();
  const componentesPorGrupo = new Map();
  for(const c of porCodigo){
    if(!c.grupoCaja || c.esCajaCompleta) continue;
    if(!componentesPorGrupo.has(c.grupoCaja)) componentesPorGrupo.set(c.grupoCaja, new Map());
    const porTituloDelGrupo = componentesPorGrupo.get(c.grupoCaja);
    const claveTitulo = c.nombre.toUpperCase();
    porTituloDelGrupo.set(claveTitulo, (porTituloDelGrupo.get(claveTitulo) || 0) + c.disponible);
  }
  for(const [grupo, porTituloDelGrupo] of componentesPorGrupo.entries()){
    const valores = Array.from(porTituloDelGrupo.values());
    disponiblePorGrupo.set(grupo, valores.length ? Math.min(...valores) : 0);
  }

  // Paso 3: armar la lista final que se muestra en el catálogo.
  // - Las filas "Solo Caja" nunca se muestran solas, se descartan aquí
  //   (ya cumplieron su función en el paso 2).
  // - Las filas "Sí" (la caja completa) usan la disponibilidad
  //   calculada arriba, ignorando lo que diga su propia columna
  //   Disponible.
  // - El resto (tomos sueltos normales) sigue igual que antes.
  const listaFinal = [];
  for(const c of porCodigo){
    if(c.esSoloCaja) continue;
    if(c.esCajaCompleta){
      const disponibleCaja = disponiblePorGrupo.has(c.grupoCaja) ? disponiblePorGrupo.get(c.grupoCaja) : 0;
      listaFinal.push(Object.assign({}, c, { disponible: disponibleCaja }));
    } else {
      listaFinal.push(c);
    }
  }

  // Paso 4: agrupar por título + precio (misma regla que el bot de
  // Telegram — mismo título y mismo precio se suma, distinto precio se
  // separa).
  const buckets = new Map();
  for(const c of listaFinal){
    const claveTitulo = c.nombre.toUpperCase();
    const clave = claveTitulo + "|" + c.precio;
    if(buckets.has(clave)){
      const b = buckets.get(clave);
      b.disponible += c.disponible;
      if(!b.autor && c.autor) b.autor = c.autor;
      if(!b.sinopsis && c.sinopsis) b.sinopsis = c.sinopsis;
      if(!b.foto && c.foto) b.foto = c.foto;
      if(!b.tipo && c.tipo) b.tipo = c.tipo;
      if(!b.idioma && c.idioma) b.idioma = c.idioma;
    } else {
      buckets.set(clave, {
        titulo: capitalizar(c.nombre),
        claveTitulo,
        autor: c.autor,
        genero: capitalizar(c.genero || "Otros"),
        precio: c.precio,
        sinopsis: c.sinopsis,
        foto: c.foto,
        tipo: c.tipo,
        idioma: c.idioma,
        disponible: c.disponible
      });
    }
  }

  // Paso 5: por título, mostrar solo el precio más barato que tenga
  // stock. Si ninguno tiene stock, se muestra agotado con el precio
  // más barato registrado (referencia para "Solicitar este libro").
  const porTitulo = new Map();
  for(const b of buckets.values()){
    if(!porTitulo.has(b.claveTitulo)) porTitulo.set(b.claveTitulo, []);
    porTitulo.get(b.claveTitulo).push(b);
  }

  const resultado = [];
  for(const lista of porTitulo.values()){
    lista.sort((a, b) => a.precio - b.precio);
    const conStock = lista.filter(b => b.disponible > 0);
    const elegido = conStock.length ? conStock[0] : lista[0];
    for(const b of lista){
      if(!elegido.autor && b.autor) elegido.autor = b.autor;
      if(!elegido.sinopsis && b.sinopsis) elegido.sinopsis = b.sinopsis;
      if(!elegido.foto && b.foto) elegido.foto = b.foto;
      if(!elegido.tipo && b.tipo) elegido.tipo = b.tipo;
      if(!elegido.idioma && b.idioma) elegido.idioma = b.idioma;
    }
    resultado.push(elegido);
  }
  return resultado;
}

function mensajeWhatsapp(libro){
  const texto = `Hola! Me interesa el libro "${libro.titulo}" (L.${libro.precio}). ¿Está disponible?`;
  return `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(texto)}`;
}

function mensajeWhatsappInsumo(item){
  const texto = `Hola! Me interesa "${item.nombre}" (L.${item.precio}). ¿Está disponible?`;
  return `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(texto)}`;
}

// Columnas del CSV de Insumos, en orden: CODIGO, NOMBRE, DISPONIBLE, PRECIO, FOTO
// Se muestra todo lo que tenga PRECIO distinto de 0, disponible o no
// (si Disponible es 0 igual aparece, marcado como Agotado).
function procesarInsumos(filas){
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const f = filas[i];
    if(!f || f.length < 4) continue;
    const nombre = normalizarTitulo(f[1] || "");
    if(!nombre) continue;
    const precio = limpiarPrecio(f[3]);
    if(!precio) continue;
    const disponible = parseInt(f[2]) || 0;
    const foto = (f[4] || "").trim();
    resultado.push({ nombre: capitalizar(nombre), disponible, precio, foto });
  }
  return resultado;
}

function renderInsumos(){
  const q = buscadorInsumos.value.trim().toLowerCase();
  const soloDisp = soloDisponiblesInsumos.checked;
  const ord = ordenInsumos.value;

  let lista = INSUMOS.filter(it=>{
    if(q && !it.nombre.toLowerCase().includes(q)) return false;
    if(soloDisp && it.disponible <= 0) return false;
    return true;
  });

  if(ord === "alfa") lista.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  if(ord === "precioAsc") lista.sort((a,b)=>a.precio-b.precio);
  if(ord === "precioDesc") lista.sort((a,b)=>b.precio-a.precio);

  contadorInsumos.textContent = `Mostrando ${lista.length} de ${INSUMOS.length}`;

  if(lista.length === 0){
    gridInsumos.innerHTML = `<div class="vacio">No encontramos nada con esos filtros.</div>`;
    return;
  }

  gridInsumos.innerHTML = lista.map(it=>`
    <div class="card">
      ${it.foto
        ? `<img class="foto" src="${it.foto}" alt="${it.nombre}" loading="lazy" decoding="async" onerror="this.outerHTML='<div class=\\'foto-vacia\\'>Letras &amp; Vinos</div>'">`
        : `<div class="foto-vacia">Letras &amp; Vinos</div>`}
      <div class="cuerpo">
        <div class="insumo-nombre">${it.nombre}</div>
        <div class="fila-precio">
          <span class="precio">L.${it.precio}</span>
          <span class="estado ${it.disponible > 0 ? 'disp':'agot'}">${it.disponible > 0 ? 'Disponible':'Agotado'}</span>
        </div>
        ${it.disponible > 0
          ? `<a class="btn activo" href="${mensajeWhatsappInsumo(it)}" target="_blank" rel="noopener">Lo quiero — WhatsApp</a>`
          : ``
        }
      </div>
    </div>
  `).join("");
}

function render(){
  const q = buscador.value.trim().toLowerCase();
  const g = filtroGenero.value;
  const t = filtroTipo.value;
  const idi = filtroIdioma.value;
  const soloDisp = soloDisponibles.checked;
  const ord = orden.value;

  let lista = LIBROS.filter(l=>{
    if(q && !l.titulo.toLowerCase().includes(q)) return false;
    if(g !== "Todos los géneros" && l.genero !== g) return false;
    if(t !== "Todos" && l.tipo !== t) return false;
    if(idi !== "Todos los idiomas" && l.idioma !== idi) return false;
    if(soloDisp && l.disponible <= 0) return false;
    return true;
  });

  if(ord === "alfa") lista.sort((a,b)=>a.titulo.localeCompare(b.titulo,'es'));
  if(ord === "precioAsc") lista.sort((a,b)=>a.precio-b.precio);
  if(ord === "precioDesc") lista.sort((a,b)=>b.precio-a.precio);

  contador.textContent = `Mostrando ${lista.length} de ${LIBROS.length} libros`;

  if(lista.length === 0){
    grid.innerHTML = `<div class="vacio">No encontramos libros con esos filtros. Prueba con otra búsqueda o género.</div>`;
    return;
  }

  grid.innerHTML = lista.map((l,i)=>`
    <div class="card">
      ${l.foto
        ? `<img class="foto" src="${l.foto}" alt="${l.titulo}" loading="lazy" decoding="async" onerror="this.outerHTML='<div class=\\'foto-vacia\\'>Letras &amp; Vinos</div>'">`
        : `<div class="foto-vacia">Letras &amp; Vinos</div>`}
      <div class="cuerpo">
        <div class="badges">
          <div class="genero-tag">${l.genero}</div>
          ${l.tipo ? `<div class="tipo-tag">${l.tipo}</div>` : ``}
          ${l.idioma ? `<div class="idioma-tag">${l.idioma}</div>` : ``}
        </div>
        <h3>${l.titulo}</h3>
        ${l.sinopsis ? `<p class="sinopsis">${l.sinopsis}</p>` : ``}
        <div class="fila-precio">
          <span class="precio">${l.precio ? 'L.' + l.precio : ''}</span>
          <span class="estado ${l.disponible > 0 ? 'disp':'agot'}">${l.disponible > 0 ? 'Disponible':'Agotado'}</span>
        </div>
        ${l.disponible > 0
          ? `<a class="btn activo" href="${mensajeWhatsapp(l)}" target="_blank" rel="noopener">Lo quiero — WhatsApp</a>`
          : `<button type="button" class="btn solicitar" data-idx="${i}">Solicitar este libro</button>`
        }
      </div>
    </div>
  `).join("");

  grid.querySelectorAll(".btn.solicitar").forEach(btn=>{
    btn.addEventListener("click", ()=> abrirModal(lista[parseInt(btn.dataset.idx)]));
  });
}

function abrirModal(libro){
  libroActivo = libro;
  modalGenero.textContent = libro.genero;
  modalTitulo.textContent = libro.titulo;
  campoNombre.value = "";
  campoCelular.value = "";
  modalMensaje.textContent = "";
  modalMensaje.className = "mensaje";
  botonEnviar.disabled = false;
  botonEnviar.textContent = "Enviar solicitud";
  overlay.classList.add("abierto");
  setTimeout(()=>campoNombre.focus(), 50);
}

function cerrar(){
  overlay.classList.remove("abierto");
  libroActivo = null;
}

cerrarModal.addEventListener("click", cerrar);
overlay.addEventListener("click", (e)=>{ if(e.target === overlay) cerrar(); });

formSolicitud.addEventListener("submit", function(e){
  e.preventDefault();
  if(!libroActivo) return;

  if(URL_APPS_SCRIPT.indexOf("PENDIENTE") === 0){
    modalMensaje.textContent = "Esta función todavía no está activada. Escríbenos directo por WhatsApp mientras tanto.";
    modalMensaje.className = "mensaje error";
    return;
  }

  botonEnviar.disabled = true;
  botonEnviar.textContent = "Enviando…";
  modalMensaje.textContent = "";
  modalMensaje.className = "mensaje";

  const payload = {
    libro: libroActivo.titulo,
    autor: libroActivo.autor || "",
    nombre: campoNombre.value.trim(),
    celular: campoCelular.value.trim()
  };

  fetch(URL_APPS_SCRIPT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  })
  .then(()=>{
    modalMensaje.textContent = "¡Listo! Te avisaremos apenas vuelva a estar disponible.";
    modalMensaje.className = "mensaje exito";
    botonEnviar.textContent = "Enviado";
    setTimeout(cerrar, 2200);
  })
  .catch(()=>{
    modalMensaje.textContent = "No se pudo enviar. Intenta de nuevo o escríbenos por WhatsApp.";
    modalMensaje.className = "mensaje error";
    botonEnviar.disabled = false;
    botonEnviar.textContent = "Enviar solicitud";
  });
});

Promise.all([
  fetch(URL_CSV).then(r => { if(!r.ok) throw new Error("No se pudo leer el inventario"); return r.text(); }),
  fetch(URL_CSV_VENTAS).then(r => { if(!r.ok) throw new Error("No se pudo leer las ventas"); return r.text(); })
])
  .then(([textoInventario, textoVentas]) => {
    const mapaVentas = parseVentasPorCodigo(parseCSV(textoVentas));
    LIBROS = procesar(parseCSV(textoInventario), mapaVentas);
    const generos = ["Todos los géneros", ...Array.from(new Set(LIBROS.map(l=>l.genero))).sort()];
    filtroGenero.innerHTML = generos.map(g=>`<option value="${g}">${g}</option>`).join("");
    const idiomas = ["Todos los idiomas", ...Array.from(new Set(LIBROS.map(l=>l.idioma).filter(Boolean))).sort()];
    filtroIdioma.innerHTML = idiomas.map(i=>`<option value="${i}">${i}</option>`).join("");
    render();
  })
  .catch(err => {
    grid.innerHTML = `<div class="vacio">No pudimos cargar el catálogo en este momento. Intenta de nuevo en unos minutos.</div>`;
  });

buscador.addEventListener("input", render);
filtroGenero.addEventListener("change", render);
filtroTipo.addEventListener("change", render);
filtroIdioma.addEventListener("change", render);
orden.addEventListener("change", render);
soloDisponibles.addEventListener("change", render);

if(URL_CSV_INSUMOS.indexOf("PENDIENTE") === 0){
  gridInsumos.innerHTML = `<div class="vacio">La Experiencia Literaria todavía no está activada.</div>`;
} else {
  fetch(URL_CSV_INSUMOS)
    .then(r => { if(!r.ok) throw new Error("No se pudo leer insumos"); return r.text(); })
    .then(texto => {
      INSUMOS = procesarInsumos(parseCSV(texto));
      renderInsumos();
    })
    .catch(err => {
      gridInsumos.innerHTML = `<div class="vacio">No pudimos cargar la Experiencia Literaria en este momento.</div>`;
    });
}

buscadorInsumos.addEventListener("input", renderInsumos);
ordenInsumos.addEventListener("change", renderInsumos);
soloDisponiblesInsumos.addEventListener("change", renderInsumos);

toggleFiltros.addEventListener("click", () => {
  const abierto = filtrosExtra.classList.toggle("abierto");
  toggleFiltros.textContent = abierto ? "Filtros ⌃" : "Filtros ⌄";
});

tabLibros.addEventListener("click", () => {
  tabLibros.classList.add("activa");
  tabInsumos.classList.remove("activa");
  vistaLibros.style.display = "";
  vistaInsumos.style.display = "none";
});
tabInsumos.addEventListener("click", () => {
  tabInsumos.classList.add("activa");
  tabLibros.classList.remove("activa");
  vistaInsumos.style.display = "";
  vistaLibros.style.display = "none";
});
</script>
