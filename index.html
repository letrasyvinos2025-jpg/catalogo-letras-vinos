<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letras & Vinos — Catálogo de libros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blanco-calido:#FAF8F3;
    --porcelana:#F2EEE8;
    --rosa-niebla:#F7DCE5;
    --lila-suave:#DCD5FF;
    --azul-hielo:#DDF5F3;
    --borgona:#7A2036;
    --borgona-osc:#5A1727;
    --coral:#FF5570;
    --coral-osc:#B33449;
    --texto:#3A3335;
    --texto-suave:#7A7275;
    --linea:#E7DFE2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--blanco-calido);
    font-family:'Inter',sans-serif;
    color:var(--texto);
  }
  header{
    padding:2.6rem 1.5rem 2.2rem;
    text-align:center;
    background:var(--borgona);
  }
  .logo-marca{
    display:block;
    max-width:400px;
    width:82%;
    margin:0 auto;
  }
  header p.tagline{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-style:italic;
    font-size:1rem;
    color:var(--rosa-niebla);
    margin:0.8rem 0 0;
  }
  header p.sub{
    font-size:0.72rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:rgba(250,248,243,0.65);
    margin:1rem 0 0;
  }
  .barra{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--blanco-calido);
    border-bottom:1px solid var(--linea);
    padding:1rem 1.5rem;
    display:flex;
    flex-wrap:wrap;
    gap:0.75rem;
    align-items:center;
    justify-content:center;
  }
  .barra input[type="text"], .barra select{
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    padding:0.55rem 0.9rem;
    border-radius:20px;
    border:1px solid var(--linea);
    background:#fff;
    color:var(--texto);
    outline:none;
  }
  .barra input[type="text"]{min-width:220px;flex:1 1 220px;}
  .barra select{cursor:pointer;}
  .barra label.chk{
    display:flex;align-items:center;gap:0.4rem;
    font-size:0.82rem;color:var(--borgona);
    background:#fff;border:1px solid var(--linea);
    padding:0.5rem 0.9rem;border-radius:20px;cursor:pointer;
  }
  .contador{
    text-align:center;font-size:0.78rem;color:var(--texto-suave);
    padding:0.8rem 1.5rem 0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:1.3rem;
    padding:1.2rem 1.5rem 3rem;
    max-width:1240px;
    margin:0 auto;
  }
  .card{
    background:#fff;
    border:1px solid var(--linea);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .card .foto{
    width:100%;
    height:170px;
    object-fit:cover;
    display:block;
    background:var(--porcelana);
  }
  .card .foto-vacia{
    width:100%;
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--porcelana);
    color:var(--texto-suave);
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:0.85rem;
  }
  .card .cuerpo{padding:1rem 1.15rem 1.15rem;display:flex;flex-direction:column;flex:1;}
  .genero-tag{
    display:inline-block;
    font-size:0.66rem;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--borgona);
    font-weight:600;
    background:var(--rosa-niebla);
    padding:0.2rem 0.6rem;
    border-radius:10px;
    margin-bottom:0.55rem;
    width:fit-content;
  }
  .card h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:1.05rem;
    line-height:1.3;
    margin:0 0 0.5rem;
    color:var(--texto);
  }
  .card .sinopsis{
    font-size:0.8rem;
    line-height:1.55;
    color:var(--texto-suave);
    margin:0 0 0.8rem;
  }
  .fila-precio{
    display:flex;align-items:center;justify-content:space-between;
    margin:0.2rem 0 0.7rem;
  }
  .precio{font-size:1.15rem;font-weight:600;color:var(--borgona);}
  .estado{
    font-size:0.7rem;font-weight:500;padding:0.2rem 0.6rem;border-radius:12px;
  }
  .estado.disp{background:var(--azul-hielo);color:#1F6E63;}
  .estado.agot{background:var(--porcelana);color:var(--coral-osc);}
  .btn{
    margin-top:auto;
    text-align:center;
    text-decoration:none;
    font-size:0.82rem;
    font-weight:500;
    padding:0.6rem 0.8rem;
    border-radius:8px;
    display:block;
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn.activo{
    background:var(--borgona);
    color:#fff;
  }
  .btn.activo:hover{background:var(--borgona-osc);}
  .btn.solicitar{
    background:#fff;
    color:var(--borgona);
    border:1.5px solid var(--borgona);
  }
  .btn.solicitar:hover{background:var(--rosa-niebla);}
  .vacio{
    text-align:center;color:var(--texto-suave);padding:3rem 1rem;font-size:0.95rem;
  }
  .cargando{
    text-align:center;color:var(--texto-suave);padding:4rem 1rem;
    font-family:'Fraunces',serif;font-style:italic;font-size:1rem;
  }
  footer{
    text-align:center;
    padding:1.8rem 1rem 2.2rem;
    background:var(--borgona);
    color:var(--blanco-calido);
    font-size:0.85rem;
  }
  footer .logo{
    font-family:'Fraunces',serif;font-weight:500;font-size:1.1rem;
    color:var(--blanco-calido);
    margin-bottom:0.5rem;
  }
  footer .datos{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;color:rgba(250,248,243,0.7);}
  .overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(58,51,53,0.45);
    align-items:center; justify-content:center;
    padding:1rem;
    z-index:100;
  }
  .overlay.abierto{ display:flex; }
  .modal{
    background:#fff;
    border-radius:16px;
    max-width:360px;
    width:100%;
    padding:1.6rem 1.5rem 1.5rem;
    position:relative;
  }
  .modal .cerrar{
    position:absolute; top:0.8rem; right:1rem;
    background:none; border:none; font-size:1.3rem;
    color:var(--texto-suave); cursor:pointer; line-height:1;
  }
  .modal .genero-tag{ margin-bottom:0.7rem; }
  .modal h3{
    font-family:'Fraunces',serif; font-weight:500; font-size:1.15rem;
    margin:0 0 0.3rem; color:var(--texto);
  }
  .modal p.ayuda{
    font-size:0.82rem; color:var(--texto-suave); margin:0 0 1.1rem; line-height:1.5;
  }
  .modal label{
    display:block; font-size:0.78rem; color:var(--texto-suave); margin:0 0 0.3rem;
  }
  .modal input[type="text"], .modal input[type="tel"]{
    width:100%; font-family:'Inter',sans-serif; font-size:0.9rem;
    padding:0.6rem 0.8rem; border-radius:8px; border:1px solid var(--linea);
    margin-bottom:1rem; outline:none;
  }
  .modal input:focus{ border-color:var(--borgona); }
  .modal .mensaje{
    font-size:0.85rem; text-align:center; padding:0.5rem 0 0.2rem; min-height:1.2rem;
  }
  .modal .mensaje.exito{ color:#1F6E63; }
  .modal .mensaje.error{ color:var(--coral-osc); }
  @media (max-width:480px){
    .barra{padding:0.8rem;}
  }
</style>
</head>
<body>

<header>
  <img class="logo-marca" src="logo_transparente.png" alt="Letras &amp; Vinos">
  <p class="tagline">Lectura en estado líquido</p>
  <p class="sub">Catálogo de libros</p>
</header>

<div class="barra">
  <input type="text" id="buscador" placeholder="Buscar por título...">
  <select id="filtroGenero"><option>Todos los géneros</option></select>
  <select id="filtroTipo">
    <option value="Todos">Pasta blanda y dura</option>
    <option value="Pasta Blanda">Pasta blanda</option>

  </select>
  <select id="orden">
    <option value="alfa">Ordenar: Título A-Z</option>

  <label class="chk"><input type="checkbox" id="soloDisponibles"> Solo disponibles</label>
</div>

<p class="contador" id="contador"></p>

<footer>

  <div class="datos">
    <span>(504) 9246-1991</span>
    <span>@letras_vinos</span>

  </div>
</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="cerrar" id="cerrarModal" aria-label="Cerrar">×</button>
    <div class="genero-tag" id="modalGenero"></div>
    <h3 id="modalTitulo"></h3>
    <p class="ayuda">Este libro está agotado por ahora. Déjanos tu nombre y celular y te avisamos apenas vuelva a estar disponible.</p>
    <form id="formSolicitud">
      <label for="campoNombre">Tu nombre</label>
      <input type="text" id="campoNombre" required>
      <label for="campoCelular">Tu número de celular</label>
      <input type="tel" id="campoCelular" required placeholder="9999-9999">
      <button type="submit" class="btn activo" id="botonEnviar">Enviar solicitud</button>
      <p class="mensaje" id="modalMensaje"></p>
    </form>
  </div>
</div>

<script>
// ---------------------------------------------------------------------
// CATÁLOGO EN VIVO: lee dos pestañas del Google Sheet, publicadas como CSV.
//
// 1) Inventario (CODIGO, NOMBRE, AUTOR, GENERO, VENDIDO, DISPONIBLE,
//    PRECIO, SINOPSIS, FOTO, TIPO) — una fila por código/lote de cada
//    libro. TIPO es Pasta Blanda / Pasta Dura, columna "TIPO DE LIBRO"
//    en Inventario de Libros.
// 2) Ventas por Código (CÓDIGO, CONTEO) — cuántas veces aparece cada
//    código en "Detalle de Ventas", sin datos de clientas.
//
// Reglas de negocio (las mismas que ya usa el bot de Telegram):
// - Un mismo título con el mismo precio en varios códigos se consolida
//   sumando su disponibilidad. Si dos códigos del mismo título tienen
//   precios distintos, se tratan por separado.
// - De los precios de un título que tengan stock, se muestra solo el
//   más barato. En cuanto ese se agota, el catálogo pasa solo al
//   siguiente precio disponible — nunca se muestran dos precios del
//   mismo título a la vez.
// - Cotejo en vivo: si "Ventas por Código" muestra más ventas de un
//   código que las que ya están registradas en VENDIDO (venta hecha
//   pero inventario aún no actualizado a mano), se resta esa
//   diferencia al disponible que se muestra, para no ofrecer un
//   ejemplar que ya está comprometido.
//
// Al editar el Sheet, el catálogo se actualiza solo (puede tardar unos
// minutos por el caché de Google).
//
// Los libros agotados muestran "Solicitar este libro": el formulario
// envía nombre y celular a una Apps Script Web App que agrega la fila
// en "Solicitudes de Libros" buscando cada columna por su encabezado,
// igual que hace el bot de Telegram.
// ---------------------------------------------------------------------
const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjfjTYsQEQ7rEAPX8I7VRqsS0lksYUPAJl_Zdv7JG9Geeq5si-yqmKXAx-2P_t7qglB2TBkJj0RpM/pub?gid=15425874&single=true&output=csv";
const URL_CSV_VENTAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjfjTYsQEQ7rEAPX8I7VRqsS0lksYUPAJl_Zdv7JG9Geeq5si-yqmKXAx-2P_t7qglB2TBkJj0RpM/pub?gid=670296559&single=true&output=csv";
const NUMERO_WHATSAPP = "50492461991";
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz0dFtc_8wt70-JXk_HD7ZFofMNA_H4dLryxf0sxZjeg1CzOd86x295969rqW_cP4yd/exec";

const grid = document.getElementById("grid");
const contador = document.getElementById("contador");
const buscador = document.getElementById("buscador");
const filtroGenero = document.getElementById("filtroGenero");
const filtroTipo = document.getElementById("filtroTipo");
const orden = document.getElementById("orden");
const soloDisponibles = document.getElementById("soloDisponibles");

const overlay = document.getElementById("overlay");
const modalGenero = document.getElementById("modalGenero");
const modalTitulo = document.getElementById("modalTitulo");
const formSolicitud = document.getElementById("formSolicitud");
const campoNombre = document.getElementById("campoNombre");
const campoCelular = document.getElementById("campoCelular");
const botonEnviar = document.getElementById("botonEnviar");
const modalMensaje = document.getElementById("modalMensaje");
const cerrarModal = document.getElementById("cerrarModal");

let LIBROS = [];
let libroActivo = null;

function parseCSV(texto){
  const filas = [];
  let fila = [], campo = "", enComillas = false;
  for(let i = 0; i < texto.length; i++){
    const c = texto[i];
    if(enComillas){
      if(c === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else enComillas = false;
      } else campo += c;
    } else {
      if(c === '"') enComillas = true;
      else if(c === ','){ fila.push(campo); campo = ""; }
      else if(c === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ""; }
      else if(c !== '\r') campo += c;
    }
  }
  if(campo !== "" || fila.length) { fila.push(campo); filas.push(fila); }
  return filas;
}

function limpiarPrecio(t){
  if(!t) return 0;
  const m = String(t).replace(/[^0-9.,]/g,'').replace(/,/g,'');
  const n = parseFloat(m);
  return isNaN(n) ? 0 : n;
}

function normalizarTitulo(t){
  return t.trim().replace(/\s+/g,' ');
}

function capitalizar(t){
  const minusculas = ['de','del','la','las','el','los','y','a','en','que','un','una','con','no','al','tu','su','mi','para','por','se'];
  return t.toLowerCase().split(' ').map((w,i)=>{
    if(i>0 && minusculas.includes(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function parseVentasPorCodigo(filas){
  const mapa = new Map();
  for(let i = 1; i < filas.length; i++){
    const f = filas[i];
    if(!f || f.length < 2) continue;
    const codigo = (f[0] || "").trim();
    if(!codigo) continue;
    const conteo = parseInt(f[1]) || 0;
    mapa.set(codigo, conteo);
  }
  return mapa;
}

// Columnas del CSV de Inventario, en orden:
// CODIGO, NOMBRE, AUTOR, GENERO, VENDIDO, DISPONIBLE, PRECIO, SINOPSIS, FOTO, TIPO
function procesar(filas, mapaVentas){
  // Paso 1: una entrada por código, con el disponible ajustado por el
  // cotejo contra "Ventas por Código".
  const porCodigo = [];
  for(let i = 1; i < filas.length; i++){
    const f = filas[i];
    if(!f || f.length < 6) continue;
    const codigo = (f[0] || "").trim();
    const nombre = normalizarTitulo(f[1] || "");
    if(!nombre) continue;
    const autor = (f[2] || "").trim();
    const genero = (f[3] || "").trim();
    const vendidoDeclarado = parseInt(f[4]) || 0;
    const disponibleDeclarado = parseInt(f[5]) || 0;
    const precio = limpiarPrecio(f[6]);
    const sinopsis = (f[7] || "").trim();
    const foto = (f[8] || "").trim();
    // Pasta Blanda / PASTA BLANDA / pasta blanda: se normaliza igual,
    // sin importar cómo se haya escrito en el Sheet.
    const tipo = capitalizar((f[9] || "").trim());

    const ventaReal = mapaVentas.get(codigo) || 0;
    const brecha = Math.max(0, ventaReal - vendidoDeclarado);
    const disponibleAjustado = Math.max(0, disponibleDeclarado - brecha);

    porCodigo.push({ nombre, autor, genero, precio, sinopsis, foto, tipo, disponible: disponibleAjustado });
  }

  // Paso 2: agrupar por título + precio (misma regla que el bot de
  // Telegram — mismo título y mismo precio se suma, distinto precio se
  // separa).
  const buckets = new Map();
  for(const c of porCodigo){
    const claveTitulo = c.nombre.toUpperCase();
    const clave = claveTitulo + "|" + c.precio;
    if(buckets.has(clave)){
      const b = buckets.get(clave);
      b.disponible += c.disponible;
      if(!b.autor && c.autor) b.autor = c.autor;
      if(!b.sinopsis && c.sinopsis) b.sinopsis = c.sinopsis;
      if(!b.foto && c.foto) b.foto = c.foto;
      if(!b.tipo && c.tipo) b.tipo = c.tipo;
    } else {
      buckets.set(clave, {
        titulo: capitalizar(c.nombre),
        claveTitulo,
        autor: c.autor,
        genero: capitalizar(c.genero || "Otros"),
        precio: c.precio,
        sinopsis: c.sinopsis,
        foto: c.foto,
        tipo: c.tipo,
        disponible: c.disponible
      });
    }
  }

  // Paso 3: por título, mostrar solo el precio más barato que tenga
  // stock. Si ninguno tiene stock, se muestra agotado con el precio
  // más barato registrado (referencia para "Solicitar este libro").
  const porTitulo = new Map();
  for(const b of buckets.values()){
    if(!porTitulo.has(b.claveTitulo)) porTitulo.set(b.claveTitulo, []);
    porTitulo.get(b.claveTitulo).push(b);
  }

  const resultado = [];
  for(const lista of porTitulo.values()){
    lista.sort((a, b) => a.precio - b.precio);
    const conStock = lista.filter(b => b.disponible > 0);
    const elegido = conStock.length ? conStock[0] : lista[0];
    for(const b of lista){
      if(!elegido.autor && b.autor) elegido.autor = b.autor;
      if(!elegido.sinopsis && b.sinopsis) elegido.sinopsis = b.sinopsis;
      if(!elegido.foto && b.foto) elegido.foto = b.foto;
      if(!elegido.tipo && b.tipo) elegido.tipo = b.tipo;
    }
    resultado.push(elegido);
  }
  return resultado;
}

function mensajeWhatsapp(libro){
  const texto = `Hola! Me interesa el libro "${libro.titulo}" (L.${libro.precio}). ¿Está disponible?`;
  return `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(texto)}`;
}

function render(){
  const q = buscador.value.trim().toLowerCase();
  const g = filtroGenero.value;
  const t = filtroTipo.value;
  const soloDisp = soloDisponibles.checked;
  const ord = orden.value;

  let lista = LIBROS.filter(l=>{
    if(q && !l.titulo.toLowerCase().includes(q)) return false;
    if(g !== "Todos los géneros" && l.genero !== g) return false;
    if(t !== "Todos" && l.tipo !== t) return false;
    if(soloDisp && l.disponible <= 0) return false;
    return true;
  });

  if(ord === "alfa") lista.sort((a,b)=>a.titulo.localeCompare(b.titulo,'es'));
  if(ord === "precioAsc") lista.sort((a,b)=>a.precio-b.precio);
  if(ord === "precioDesc") lista.sort((a,b)=>b.precio-a.precio);

  contador.textContent = `Mostrando ${lista.length} de ${LIBROS.length} libros`;

  if(lista.length === 0){
    grid.innerHTML = `<div class="vacio">No encontramos libros con esos filtros. Prueba con otra búsqueda o género.</div>`;
    return;
  }

  grid.innerHTML = lista.map((l,i)=>`
    <div class="card">
      ${l.foto
        ? `<img class="foto" src="${l.foto}" alt="${l.titulo}" loading="lazy" onerror="this.outerHTML='<div class=\\'foto-vacia\\'>Letras &amp; Vinos</div>'">`
        : `<div class="foto-vacia">Letras &amp; Vinos</div>`}
      <div class="cuerpo">
        <div class="genero-tag">${l.genero}${l.tipo ? ' · ' + l.tipo : ''}</div>
        <h3>${l.titulo}</h3>
        ${l.sinopsis ? `<p class="sinopsis">${l.sinopsis}</p>` : ``}
        <div class="fila-precio">
          <span class="precio">${l.precio ? 'L.' + l.precio : ''}</span>
          <span class="estado ${l.disponible > 0 ? 'disp':'agot'}">${l.disponible > 0 ? 'Disponible':'Agotado'}</span>
        </div>
        ${l.disponible > 0
          ? `<a class="btn activo" href="${mensajeWhatsapp(l)}" target="_blank" rel="noopener">Lo quiero — WhatsApp</a>`
          : `<button type="button" class="btn solicitar" data-idx="${i}">Solicitar este libro</button>`
        }
      </div>
    </div>
  `).join("");

  grid.querySelectorAll(".btn.solicitar").forEach(btn=>{
    btn.addEventListener("click", ()=> abrirModal(lista[parseInt(btn.dataset.idx)]));
  });
}

function abrirModal(libro){
  libroActivo = libro;
  modalGenero.textContent = libro.genero;
  modalTitulo.textContent = libro.titulo;
  campoNombre.value = "";
  campoCelular.value = "";
  modalMensaje.textContent = "";
  modalMensaje.className = "mensaje";
  botonEnviar.disabled = false;
  botonEnviar.textContent = "Enviar solicitud";
  overlay.classList.add("abierto");
  setTimeout(()=>campoNombre.focus(), 50);
}

function cerrar(){
  overlay.classList.remove("abierto");
  libroActivo = null;
}

cerrarModal.addEventListener("click", cerrar);
overlay.addEventListener("click", (e)=>{ if(e.target === overlay) cerrar(); });

formSolicitud.addEventListener("submit", function(e){
  e.preventDefault();
  if(!libroActivo) return;

  if(URL_APPS_SCRIPT.indexOf("PENDIENTE") === 0){
    modalMensaje.textContent = "Esta función todavía no está activada. Escríbenos directo por WhatsApp mientras tanto.";
    modalMensaje.className = "mensaje error";
    return;
  }

  botonEnviar.disabled = true;
  botonEnviar.textContent = "Enviando…";
  modalMensaje.textContent = "";
  modalMensaje.className = "mensaje";

  const payload = {
    libro: libroActivo.titulo,
    autor: libroActivo.autor || "",
    nombre: campoNombre.value.trim(),
    celular: campoCelular.value.trim()
  };

  fetch(URL_APPS_SCRIPT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  })
  .then(()=>{
    modalMensaje.textContent = "¡Listo! Te avisaremos apenas vuelva a estar disponible.";
    modalMensaje.className = "mensaje exito";
    botonEnviar.textContent = "Enviado";
    setTimeout(cerrar, 2200);
  })
  .catch(()=>{
    modalMensaje.textContent = "No se pudo enviar. Intenta de nuevo o escríbenos por WhatsApp.";
    modalMensaje.className = "mensaje error";
    botonEnviar.disabled = false;
    botonEnviar.textContent = "Enviar solicitud";
  });
});

Promise.all([
  fetch(URL_CSV).then(r => { if(!r.ok) throw new Error("No se pudo leer el inventario"); return r.text(); }),
  fetch(URL_CSV_VENTAS).then(r => { if(!r.ok) throw new Error("No se pudo leer las ventas"); return r.text(); })
])
  .then(([textoInventario, textoVentas]) => {
    const mapaVentas = parseVentasPorCodigo(parseCSV(textoVentas));
    LIBROS = procesar(parseCSV(textoInventario), mapaVentas);
    const generos = ["Todos los géneros", ...Array.from(new Set(LIBROS.map(l=>l.genero))).sort()];
    filtroGenero.innerHTML = generos.map(g=>`<option value="${g}">${g}</option>`).join("");
    render();
  })
  .catch(err => {
    grid.innerHTML = `<div class="vacio">No pudimos cargar el catálogo en este momento. Intenta de nuevo en unos minutos.</div>`;
  });

buscador.addEventListener("input", render);
filtroGenero.addEventListener("change", render);
filtroTipo.addEventListener("change", render);
orden.addEventListener("change", render);
soloDisponibles.addEventListener("change", render);
</script>

</body>
</html>
