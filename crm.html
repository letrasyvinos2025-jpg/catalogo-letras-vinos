<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM · Letras & Vinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --vino:#3D0A14; --borgona:#6B1A2A; --rosa:#C4687A; --crema:#FAF6F0; --calido:#F0EBE3;
  --arena:#8A8076; --oro:#C9A96E; --tinta:#2A1F22; --suave:#6C635B; --linea:#E3DBD0; --blanco:#FFFFFF;
  --titulo:"Playfair Display",Georgia,"Times New Roman",serif; --texto:Lato,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--crema);color:var(--tinta);font-family:var(--texto);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--titulo);color:var(--vino);margin:0;font-weight:700;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--borgona);outline-offset:2px}
.oculto{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Entrada */
.entrada{min-height:100vh;display:grid;place-items:center;padding:24px}
.entrada form{width:min(400px,100%);background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:28px 26px 24px;text-align:center}
.entrada img{width:230px;max-width:80%;height:auto}
.entrada h1{font-size:22px;margin:6px 0 4px}
.entrada p{color:var(--suave);margin:0 0 18px;font-size:14px}
.entrada input{width:100%;padding:12px 14px;border:1px solid var(--linea);border-radius:9px;background:var(--crema);text-align:center;letter-spacing:.04em}
.entrada label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--suave);margin:12px 0 16px}
.aviso{color:var(--borgona);font-size:13.5px;min-height:20px;margin-top:10px}

.btn{border:1px solid var(--borgona);background:var(--borgona);color:#fff;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px}
.btn{text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:var(--vino);border-color:var(--vino)}
.btn.claro{background:transparent;color:var(--borgona)}
.btn.claro:hover{background:var(--calido)}
.btn.chico{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.ancho{width:100%}

/* Marco */
header.barra{background:var(--blanco);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:5}
.barra .fila{max-width:1180px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:14px}
.barra img{height:54px;width:auto}
@media (max-width:560px){.barra img{height:40px}.barra .rotulo small{display:none}.barra .fila{gap:10px;padding:8px 12px}}
.barra .rotulo{font-family:var(--titulo);color:var(--vino);font-size:17px;border-left:1px solid var(--linea);padding-left:14px;line-height:1.2}
.barra .rotulo small{display:block;font-family:var(--texto);font-size:12px;color:var(--suave);font-weight:400}
.barra .acciones{margin-left:auto;display:flex;gap:8px}
nav.pestanas{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;gap:4px;overflow-x:auto}
nav.pestanas button{border:0;background:none;padding:11px 14px;font-weight:700;color:var(--suave);border-bottom:3px solid transparent;white-space:nowrap}
nav.pestanas button[aria-selected=true]{color:var(--borgona);border-bottom-color:var(--borgona)}
main{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
.demo{background:var(--vino);color:#fff;text-align:center;font-size:13px;padding:6px 12px}
.intro{color:var(--suave);margin:4px 0 18px;max-width:70ch}
h2{font-size:24px}
h3{font-size:17px}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:18px}

/* Resumen */
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.cifra{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:14px 16px}
.cifra b{display:block;font-family:var(--titulo);font-size:28px;color:var(--vino);line-height:1.15}
.cifra span{font-size:13px;color:var(--suave)}
.cifra em{display:block;font-style:normal;font-size:12px;color:var(--arena);margin-top:2px}
.dos{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
@media (max-width:860px){.dos{grid-template-columns:1fr}}
.leyenda{display:flex;gap:16px;font-size:13px;color:var(--suave);margin:6px 0 8px}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{font-family:var(--texto);fill:var(--suave);font-size:11px}
.pendientes{list-style:none;margin:10px 0 0;padding:0}
.pendientes li{border-top:1px solid var(--linea)}
.pendientes li:first-child{border-top:0}
.pendientes button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 2px;text-align:left}
.pendientes button:hover{background:var(--crema)}
.pendientes .n{font-family:var(--titulo);font-size:22px;color:var(--borgona);min-width:42px;text-align:right}
.pendientes small{display:block;color:var(--suave);font-size:12.5px}
.barras{display:grid;gap:7px;margin-top:10px}
.barras div{display:grid;grid-template-columns:160px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.barras i{display:block;height:9px;border-radius:5px;background:var(--rosa)}
.barras span:last-child{text-align:right;color:var(--suave)}

/* Segmentos */
.segmentos{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
@media (max-width:860px){.segmentos{grid-template-columns:1fr}}
.lista-seg{display:grid;gap:4px}
.lista-seg h4{font:700 11.5px var(--texto);letter-spacing:.09em;text-transform:uppercase;color:var(--arena);margin:12px 6px 2px}
.lista-seg button{display:flex;justify-content:space-between;gap:10px;border:1px solid transparent;background:none;border-radius:9px;padding:8px 10px;text-align:left}
.lista-seg button:hover{background:var(--calido)}
.lista-seg button[aria-pressed=true]{background:var(--blanco);border-color:var(--linea);color:var(--borgona);font-weight:700}
.lista-seg button span:last-child{color:var(--suave);font-weight:400}
@media (max-width:860px){.lista-seg{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:6px}.lista-seg h4{display:none}.lista-seg button{border-color:var(--linea);background:var(--blanco)}}
.que-hacer{background:var(--calido);border-radius:10px;padding:12px 14px;margin:10px 0 14px;font-size:14px}
details.mensaje{margin-bottom:14px}
details.mensaje summary{cursor:pointer;color:var(--borgona);font-weight:700;font-size:14px}
details.mensaje textarea{width:100%;min-height:110px;margin-top:8px;border:1px solid var(--linea);border-radius:9px;padding:10px;background:var(--blanco);resize:vertical}
details.mensaje p{font-size:12.5px;color:var(--suave);margin:6px 0 0}
.herramientas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.herramientas .cuenta{color:var(--suave);font-size:13.5px;margin-right:auto}

/* Filas de clientas */
.filas{display:grid;gap:8px}
.clienta{background:var(--blanco);border:1px solid var(--linea);border-radius:11px;padding:11px 14px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.6fr) auto;gap:12px;align-items:center}
.clienta.hecha{opacity:.62}
.clienta .quien b{display:block;color:var(--vino);font-size:15.5px;overflow-wrap:anywhere}
.clienta .quien span,.clienta .dato{font-size:13px;color:var(--suave)}
.clienta .dato strong{color:var(--tinta);font-weight:700}
.clienta .botones{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.clienta label{font-size:12.5px;color:var(--suave);display:flex;gap:5px;align-items:center;white-space:nowrap}
@media (max-width:720px){.clienta{grid-template-columns:1fr}.clienta .botones{justify-content:flex-start}}
.vacio{text-align:center;color:var(--suave);padding:34px 10px;background:var(--blanco);border:1px dashed var(--linea);border-radius:12px}
.filtros{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:860px){.filtros{grid-template-columns:1fr 1fr}.filtros input{grid-column:1/-1}}
.filtros input,.filtros select{padding:9px 11px;border:1px solid var(--linea);border-radius:9px;background:var(--blanco);width:100%;min-width:0}
.mas{display:block;margin:14px auto 0}
.chip{display:inline-block;font-size:12px;border:1px solid var(--linea);border-radius:20px;padding:2px 9px;margin:2px 4px 2px 0;background:var(--crema);color:var(--suave)}
.chip.fuerte{border-color:var(--borgona);color:var(--borgona);background:var(--blanco)}

/* Ficha */
.velo{position:fixed;inset:0;background:rgba(61,10,20,.45);z-index:20;display:flex;justify-content:flex-end}
.ficha{background:var(--crema);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px 20px 60px}
.ficha .cerrar{float:right}
.ficha h2{font-size:25px;overflow-wrap:anywhere;padding-right:8px}
.ficha .sub{color:var(--suave);margin:2px 0 10px}
.ficha section{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin-top:12px}
.ficha h3{margin-bottom:8px}
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
.rejilla div span{display:block;font-size:12px;color:var(--suave)}
.rejilla div b{font-size:15.5px;color:var(--vino)}
.sellos{display:flex;gap:6px;margin:6px 0 8px;flex-wrap:wrap}
.sellos i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--rosa);display:block}
.sellos i.puesto{background:var(--borgona);border-color:var(--borgona)}
.premio{border-left:3px solid var(--oro);padding:4px 0 4px 10px;margin-top:6px;font-size:14px}
.compra{border-top:1px solid var(--linea);padding:9px 0}
.compra:first-of-type{border-top:0}
.compra header{display:flex;justify-content:space-between;gap:10px;font-weight:700;color:var(--vino)}
.compra ul{margin:4px 0 0;padding:0;list-style:none;font-size:13.5px}
.compra li{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.compra li small{color:var(--suave)}
.nota{font-size:12.5px;color:var(--suave);margin:8px 0 0}
table.simple{width:100%;border-collapse:collapse;font-size:14px}
table.simple td,table.simple th{padding:7px 6px;border-top:1px solid var(--linea);text-align:left;vertical-align:top}
table.simple th{border-top:0;font-size:12px;color:var(--suave);font-weight:700}
.cargando{text-align:center;padding:70px 10px;color:var(--suave)}
</style>
</head>

// ---------- Carga ----------
function entrar(forzar) {
  document.getElementById("entrada").classList.add("oculto");
  document.getElementById("app").classList.remove("oculto");
  document.getElementById("contenido").innerHTML = '<div class="cargando">Leyendo el Sheet…</div>';
  if (DEMO) { recibir(window.DATOS_DEMO); return; }
  fetch(URL_CRM, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ accion: "crm", clave: clave, forzar: forzar ? 1 : 0 }) })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r.ok) {
        if (r.error === "no_autorizado") { olvidar("clave"); salir("La clave no es correcta."); }
        else salir("El Sheet respondió con un error: " + r.error);
        return;
      }
      recibir(r);
    })
    .catch(function () { salir("No se pudo conectar. Revisá tu internet e intentá de nuevo."); });
}
function recibir(r) {
  D = r; porCel = {};
  D.clientas.forEach(function (c) { porCel[c.c] = c; });
  var g = new Date(D.generado);
  document.getElementById("actualizado").textContent = "Datos del " + fecha(D.hoy) + ", " +
    String(g.getHours()).padStart(2, "0") + ":" + String(g.getMinutes()).padStart(2, "0");
  document.getElementById("bandaDemo").classList.toggle("oculto", !DEMO);
  pintar();
}
function salir(aviso) {
  D = null;
  document.getElementById("app").classList.add("oculto");
  document.getElementById("entrada").classList.remove("oculto");
  document.getElementById("avisoClave").textContent = aviso || "";
  document.getElementById("clave").value = "";
}

function cifra(valor, titulo, detalle) { return '<div class="cifra"><b class="num">' + valor + '</b><span>' + titulo + '</span><em>' + detalle + '</em></div>'; }
function graficoMeses(meses) {
  var W = 620, H = 210, izq = 28, base = 176, ancho = (W - izq - 6) / meses.length, max = 1;
  meses.forEach(function (m) { max = Math.max(max, m.nuevas + m.recurrentes); });
  var tope = Math.ceil(max / 10) * 10, alto = base - 18, s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Clientas que compraron cada mes, separadas en primera compra y recompra" style="width:100%;height:auto">';
  [0, tope / 2, tope].forEach(function (v) {
    var y = base - v / tope * alto;
    s += '<line x1="' + izq + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#E3DBD0"/><text x="' + (izq - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>';
  });
  meses.forEach(function (m, i) {
    var x = izq + i * ancho + ancho * 0.18, w = ancho * 0.64;
    var hr = m.recurrentes / tope * alto, hn = m.nuevas / tope * alto, p = m.mes.split("-");
    s += '<g><title>' + MESES[Number(p[1]) - 1] + ' ' + p[0] + ': ' + m.recurrentes + ' ya habían comprado, ' + m.nuevas + ' primera compra</title>' +
      '<rect x="' + x + '" y="' + (base - hr) + '" width="' + w + '" height="' + hr + '" fill="#6B1A2A"/>' +
      '<rect x="' + x + '" y="' + (base - hr - hn - (hr && hn ? 2 : 0)) + '" width="' + w + '" height="' + hn + '" fill="#C4687A"/>' +
      '<text x="' + (x + w / 2) + '" y="' + (base - hr - hn - 7) + '" text-anchor="middle">' + (m.nuevas + m.recurrentes || "") + '</text>' +
      '<text x="' + (x + w / 2) + '" y="' + (base + 15) + '" text-anchor="middle">' + MESES[Number(p[1]) - 1] + '</text>' +
      (p[1] === "01" || i === 0 ? '<text x="' + (x + w / 2) + '" y="' + (base + 29) + '" text-anchor="middle">' + p[0] + '</text>' : '') + '</g>';
  });
  return s + '</svg>';
}

  for (var i = 1; i <= 10; i++) h += '<i class="' + (i <= c.t.s ? "puesto" : "") + '"></i>';
  h += '</div><div><b>' + c.t.s + ' de 10 sellos</b> · ' + (c.t.plan === "anterior" ? "tarjeta anterior, válida hasta el " + fecha(D.cortes.finAnterior) : "tarjeta nueva") +
    (c.t.comp ? " · " + c.t.comp + (c.t.comp === 1 ? " tarjeta completada" : " tarjetas completadas") : "") + '</div>';
  c.t.pen.forEach(function (p) { h += '<div class="premio">Premio para su próxima compra: <b>' + esc(p) + '</b></div>'; });
  if (c.t.prox) h += '<div class="premio">Con su próximo libro alcanza: <b>' + esc(c.t.prox) + '</b></div>';
  h += '</section>';

  if (c.m.gen.length || c.m.aut.length) {
    h += '<section><h3>Lo que Le Gusta Leer</h3>';
    if (c.m.gen.length) h += '<div>' + c.m.gen.map(function (g) { return '<span class="chip">' + esc(g[0]) + ' · ' + g[1] + '</span>'; }).join("") + '</div>';
    if (c.m.aut.length) h += '<p class="nota">Autores: ' + esc(c.m.aut.map(function (a) { return a[0] + (a[1] > 1 ? " (" + a[1] + ")" : ""); }).join(", ")) + '</p>';
    h += '</section>';
  }

  var grupos = {};
  c.l.forEach(function (l) { (grupos[l.f] || (grupos[l.f] = [])).push({ t: l.t, p: l.p, x: [l.d && l.d !== "No Aplica" ? l.d : "", l.cj ? "con caja" : "", l.cc ? "cita a ciegas" : "", l.ec && l.ec !== "Pagado" ? l.ec : ""].filter(Boolean).join(" · "), cn: l.cn, vd: l.vd }); });
  c.i.forEach(function (l) { (grupos[l.f] || (grupos[l.f] = [])).push({ t: (l.q > 1 ? l.q + " × " : "") + l.t, p: l.p, x: "Experiencia Literaria", cn: l.cn, vd: l.vd }); });
  var fechas = Object.keys(grupos).sort().reverse();
  h += '<section><h3>Historial de Compras</h3>';
  if (!fechas.length) h += '<p class="nota">No tiene compras registradas con este celular.</p>';
  fechas.forEach(function (f) {
    var total = grupos[f].reduce(function (s, l) { return s + l.p; }, 0), uno = grupos[f][0];
    h += '<div class="compra"><header><span>' + fecha(f) + '</span><span class="num">' + L(total) + '</span></header><ul>';
    grupos[f].forEach(function (l) { h += '<li><span>' + esc(l.t) + (l.x ? ' <small>· ' + esc(l.x) + '</small>' : '') + '</span><span class="num">' + L(l.p) + '</span></li>'; });
    h += '</ul><p class="nota" style="margin-top:3px">' + esc([uno.cn, uno.vd].filter(Boolean).join(" · ")) + '</p></div>';
  });
  h += '</section>';

  if (c.sol.length) {
    h += '<section><h3>Libros que Ha Pedido</h3><table class="simple"><tr><th>Libro</th><th>Fecha</th><th>Estado</th></tr>';
    c.sol.forEach(function (s) {
      h += '<tr><td>' + esc(s.t) + (s.a ? '<br><small style="color:var(--suave)">' + esc(s.a) + '</small>' : '') + '</td><td class="num">' + fecha(s.f) + '</td><td>' +
        (s.ll ? '<span class="chip fuerte">Ya hay existencias</span>' : s.ab ? esc(s.es + (s.co ? " · " + s.co : "")) : '<span style="color:var(--suave)">' + esc(s.es === "Ya no le interesa" ? s.es : "Ya lo compró") + '</span>') + '</td></tr>';
    });
    h += '</table></section>';
  }
  if (c.ev.length) {
    h += '<section><h3>Eventos</h3><table class="simple"><tr><th>Evento</th><th>Estado</th><th>Pagó</th></tr>';
    c.ev.forEach(function (e) { h += '<tr><td>' + esc(e.t) + '</td><td>' + esc(e.es || "—") + '</td><td class="num">' + (e.p ? L(e.p) : "—") + '</td></tr>'; });
    h += '</table></section>';
  }
  if (c.al.length) h += '<p class="nota">También aparece en el Sheet como: ' + esc(c.al.join(" · ")) + '</p>';

  document.getElementById("ficha").innerHTML = h;
  document.getElementById("velo").classList.remove("oculto");
  document.getElementById("ficha").scrollTop = 0;
  document.getElementById("cerrarFicha").focus();
}
function par(t, v) { return '<div><span>' + t + '</span><b class="num">' + esc(v) + '</b></div>'; }
function cerrarFicha() { document.getElementById("velo").classList.add("oculto"); }

// ---------- Eventos ----------
document.getElementById("formClave").addEventListener("submit", function (e) {
  e.preventDefault();
  clave = document.getElementById("clave").value.trim();
  if (!clave) return;
  if (document.getElementById("recordar").checked) guardar("clave", clave); else olvidar("clave");
  document.getElementById("avisoClave").textContent = "";
  entrar(false);
});
document.getElementById("pestanas").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b || !D) return;
  estado.vista = b.dataset.vista; estado.limite = 60; pintar(); window.scrollTo(0, 0);
});
document.getElementById("btnActualizar").addEventListener("click", function () { entrar(true); });
document.getElementById("btnSalir").addEventListener("click", function () { olvidar("clave"); clave = ""; salir(""); });
document.getElementById("velo").addEventListener("click", function (e) { if (e.target.id === "velo" || e.target.id === "cerrarFicha") cerrarFicha(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") cerrarFicha(); });

document.addEventListener("click", function (e) {
  var t = e.target;
  if (t.dataset.ficha) { abrirFicha(t.dataset.ficha); return; }
  var ir = t.closest("[data-ir]");
  if (ir) { estado.vista = "segmentos"; estado.seg = ir.dataset.ir; estado.limite = 60; pintar(); window.scrollTo(0, 0); return; }
  var s = t.closest("[data-seg]");
  if (s) { estado.seg = s.dataset.seg; estado.limite = 60; pintar(); return; }
  if (t.id === "verMas") { estado.limite += 60; if (estado.vista === "clientas") document.getElementById("resultado").innerHTML = resultadoClientas(); else pintar(); return; }
  if (t.id === "restaurar") { olvidar("msg_" + estado.seg); pintar(); return; }
  if (t.id === "copiar") {
    var texto = deSegmento(estado.seg).map(function (c) { return c.n + "\t" + cel(c.c); }).join("\n");
    var listo = function () { t.textContent = "Lista Copiada"; setTimeout(function () { t.textContent = "Copiar Lista"; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(texto).then(listo, function () {});
  }
});
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.dataset.hecha) {
    var hechas = leer("hechas", {});
    if (t.checked) { var h = new Date(); hechas[t.dataset.hecha] = String(h.getDate()).padStart(2, "0") + "/" + String(h.getMonth() + 1).padStart(2, "0"); }
    else delete hechas[t.dataset.hecha];
    guardar("hechas", hechas); pintar(); return;
  }
  if (t.id === "plantilla") { guardar("msg_" + estado.seg, t.value); pintar(); return; }
  if (["fSeg", "fGen", "fVen", "orden"].indexOf(t.id) !== -1) {
    estado[t.id] = t.value; estado.limite = 60;
    document.getElementById("resultado").innerHTML = resultadoClientas();
  }
});
document.addEventListener("input", function (e) {
  if (e.target.id === "buscar") { estado.buscar = e.target.value; estado.limite = 60; document.getElementById("resultado").innerHTML = resultadoClientas(); }
});

// ---------- Arranque ----------
(function () {
  if (DEMO) { entrar(false); return; }
  // Enlace con clave: crm.html#k=CLAVE (la parte tras # no viaja a ningún servidor).
  var m = location.hash.match(/k=([^&]+)/);
  if (m) { clave = decodeURIComponent(m[1]); guardar("clave", clave); history.replaceState(null, "", location.pathname); }
  else clave = leer("clave", "");
  if (clave) entrar(false);
})();
</script>
</body>
